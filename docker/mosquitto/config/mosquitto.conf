# Sy Water - Mosquitto 2.0 broker for local development.
# Paths are INSIDE the container (see compose.yml volumes).

# Keep QoS 1 messages and sessions across restarts
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Plain MQTT on 1883 (development only; production must use TLS on 8883)
listener 1883

# Nobody connects without a user; each user can only use the topics in the ACL
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
